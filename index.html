<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071820" />
    <meta name="description" content="Wazi — open the record, see for yourself. A civic companion that reads the public record back to you, shows where it differs from what you are looking at, and writes to the office that owes you an answer." />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/app.css" />
    <link rel="stylesheet" href="src/styles/print.css" media="print" />
    <title>Wazi</title>
  </head>
  <body>
    <a class="sr-only" href="#main">Skip to content</a>

    <div id="app">
      <!-- NIGHT — the companion side. §7 -->
      <main class="world night" id="main">
        <div class="night__top">
          <button class="lang-chip" id="langBtn" type="button" aria-haspopup="dialog">
            <span id="langLabel">English</span>
            <span class="lang-tier" id="langTier">tested</span>
          </button>
        </div>

        <div class="night__stage">
          <div id="apertureHost"></div>
          <div id="captionHost"></div>
          <div class="chips" id="chipHost"></div>
          <p class="statusline" id="statusLine" role="status" aria-live="polite"></p>
        </div>

        <div class="night__foot">
          <button class="night-btn" id="cameraBtn" type="button" aria-label="Show Wazi something with the camera">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2L9 4h6l1.5 2h2A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-9Z"/>
              <circle cx="12" cy="13" r="3.6"/>
            </svg>
            <span>Show</span>
          </button>

          <button class="night-btn" id="casesBtn" type="button" aria-label="Open my saved cases">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="M4 7h16v12H4z"/><path d="M9 7V5h6v2"/>
            </svg>
            <span>Cases</span>
          </button>

          <button class="night-btn" id="typeBtn" type="button" aria-label="Type instead of speaking">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <rect x="2.5" y="6" width="19" height="12" rx="2"/>
              <path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/>
            </svg>
            <span>Type</span>
          </button>
        </div>
      </main>

      <!-- DAY — the record side. Slides up over Night. §7 -->
      <section class="world day" id="day" aria-label="Evidence" hidden>
        <div class="day__inner">
          <div class="day__bar">
            <button class="day__back" id="dayBack" type="button">
              <span aria-hidden="true">←</span><span>Back</span>
            </button>
            <span class="wordmark">wazi</span>
            <span class="day__id" id="dayCaseId"></span>
          </div>
          <div id="dayBody"></div>
        </div>
      </section>

      <!-- Companion anchor while a workspace is open. §15.4 -->
      <div class="companion" id="companion" hidden>
        <div id="companionHost"></div>
        <p class="companion__say" id="companionSay" hidden></p>
      </div>
    </div>

    <noscript>
      <p style="padding:16px;font:16px/24px system-ui">
        Wazi needs JavaScript. Everything it does runs on your own phone — there is no server
        to fall back to.
      </p>
    </noscript>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
